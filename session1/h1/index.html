<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>支出の整理</title>
<style>
  :root {
    --border: #d9dee3;
    --head-bg: #2f3a4a;
    --head-fg: #ffffff;
    --row-alt: #f6f8fa;
    --accent: #2f6fed;
    --text: #1d2530;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 32px 16px;
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, system-ui, sans-serif;
    color: var(--text);
    background: #eef1f4;
  }
  .wrap { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .summary { color: #5a6573; font-size: 14px; margin: 0 0 20px; }
  table {
    width: 100%;
    border-collapse: collapse;
    background: #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,.08);
    border-radius: 8px;
    overflow: hidden;
  }
  thead th {
    background: var(--head-bg);
    color: var(--head-fg);
    font-weight: 600;
    font-size: 14px;
    text-align: left;
    padding: 12px 16px;
  }
  tbody td {
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    font-size: 15px;
    vertical-align: middle;
  }
  tbody tr:nth-child(even) { background: var(--row-alt); }
  .amount { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .category span {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 999px;
    background: #e7eefc;
    color: var(--accent);
    font-size: 13px;
  }
  th.col-img, td.col-img { text-align: right; width: 150px; }
  .img-btn {
    appearance: none;
    border: 1px solid var(--accent);
    background: #fff;
    color: var(--accent);
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .img-btn:hover { background: var(--accent); color: #fff; }
  .receipt {
    display: block;
    max-width: 140px;
    max-height: 180px;
    margin-left: auto;
    border: 1px solid var(--border);
    border-radius: 6px;
  }
  tfoot td {
    padding: 14px 16px;
    border-top: 2px solid var(--head-bg);
    font-weight: 700;
    font-size: 15px;
  }
  tfoot .amount { font-size: 17px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>支出の整理</h1>
  <p class="summary">領収書・レシート画像から抽出した支出一覧。右端のボタンを押すと該当画像を読み込みます。</p>
  <table>
    <thead>
      <tr>
        <th>発生日</th>
        <th class="amount">額</th>
        <th>項目</th>
        <th class="col-img">画像</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
    <tfoot>
      <tr>
        <td>合計</td>
        <td class="amount" id="total"></td>
        <td colspan="2"></td>
      </tr>
    </tfoot>
  </table>
</div>

<script>
  const expenses = [
    { date: "2019-10",    amount: 85250, category: "学費",        img: "img/i1.jpeg" },
    { date: "2023-12-20", amount: 8250,  category: "食費",        img: "img/i2.webp" },
    { date: "2021-08-20", amount: 348,   category: "食費・日用品", img: "img/i3.webp" },
    { date: "2024-04-05", amount: 709,   category: "食費",        img: "img/i4.jpeg" },
    { date: "2025-05-01", amount: 9900,  category: "文具費",      img: "img/i5.png"  }
  ];

  const yen = (n) => "¥" + n.toLocaleString("ja-JP");

  function showImage(button, src) {
    const image = document.createElement("img");
    image.className = "receipt";
    image.alt = "領収書画像";
    image.src = src;
    button.replaceWith(image);
  }

  const tbody = document.getElementById("rows");
  let total = 0;

  for (const expense of expenses) {
    total += expense.amount;

    const row = document.createElement("tr");

    const dateCell = document.createElement("td");
    dateCell.textContent = expense.date;

    const amountCell = document.createElement("td");
    amountCell.className = "amount";
    amountCell.textContent = yen(expense.amount);

    const categoryCell = document.createElement("td");
    categoryCell.className = "category";
    const tag = document.createElement("span");
    tag.textContent = expense.category;
    categoryCell.appendChild(tag);

    const imgCell = document.createElement("td");
    imgCell.className = "col-img";
    const button = document.createElement("button");
    button.className = "img-btn";
    button.textContent = "画像を表示";
    button.addEventListener("click", () => showImage(button, expense.img));
    imgCell.appendChild(button);

    row.append(dateCell, amountCell, categoryCell, imgCell);
    tbody.appendChild(row);
  }

  document.getElementById("total").textContent = yen(total);
</script>
</body>
</html>
